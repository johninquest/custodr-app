# Development overrides - use with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ============================================
  # PostgreSQL Database (Development)
  # ============================================
  postgres:
    image: postgres:18-alpine
    container_name: custodr-app-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pgpassword}
      - POSTGRES_DB=${POSTGRES_DB:-pgdb}
    # Published so `drizzle-kit migrate` can target localhost:5432 without the
    # `docker run --network` workaround. Remove (or leave unset) in production.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images expect a single mount at /var/lib/postgresql and
      # place data in a major-version subdirectory. Mounting .../data directly
      # makes the entrypoint reject the volume. See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
    networks:
      - custodr-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pguser} -d ${POSTGRES_DB:-pgdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # NestJS Backend API (Development)
  # ============================================
  api:
    build:
      context: .
      dockerfile: apps/api-nest/Dockerfile.dev
    volumes:
      - ./apps/api-nest:/app/apps/api-nest
    environment:
      - NODE_ENV=development
      - PORT=8080
      - LOG_LEVEL=debug
      - DATABASE_URL=postgres://${POSTGRES_USER:-pguser}:${POSTGRES_PASSWORD:-pgpassword}@postgres:5432/${POSTGRES_DB:-pgdb}?sslmode=disable
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - DEV_AUTH_TOKEN=${DEV_AUTH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    # `nest start --watch` for hot reload (defined in Dockerfile.dev CMD)

  # ============================================
  # React Frontend (Development)
  # ============================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
    environment:
      - VITE_API_BASE_URL=/api/v1
    # Vite dev server with HMR
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
