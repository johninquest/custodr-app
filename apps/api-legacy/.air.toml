root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server.exe"
  cmd = "go build -o ./tmp/server.exe ./cmd/server"
  delay = 500
  exclude_dir = ["tmp", "vendor", "data", "migrations", "bin"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

